<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAVE 릴레이 그림 그리기 게임</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            text-align: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            max-width: 480px;
            width: 100%;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 { font-size: 24px; color: #4a5568; margin-bottom: 10px; }
        .sub-title { font-size: 15px; color: #718096; margin-bottom: 25px; }
        
        .setting-box {
            margin-bottom: 20px;
            text-align: left;
            background: #f7fafc;
            padding: 15px;
            border-radius: 12px;
        }
        label { font-size: 14px; font-weight: bold; color: #2d3748; display: block; margin-bottom: 8px; }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e0;
            font-size: 15px;
            background: white;
        }

        .start-btn {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transition: transform 0.1s;
        }
        .start-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 PLAVE 릴레이 그림판</h1>
        <div class="sub-title">버츄얼 아이돌 예능 스타일 릴레이 게임</div>
        
        <div class="setting-box">
            <label for="playerCount">👥 플레이어 인원 선택 (1명 ~ 5명)</label>
            <select id="playerCount">
                <option value="1">1인 혼자 연습 모드</option>
                <option value="2">2인 플레이</option>
                <option value="3">3인 플레이</option>
                <option value="4" selected>4인 플레이</option>
                <option value="5">5인 플레이</option>
            </select>
        </div>

        <button class="start-btn" onclick="startGame()">게임 시작하기!</button>
    </div>

    <script>
        function startGame() {
            const count = document.getElementById('playerCount').value;
            alert(`${count}인 플레이 모드로 릴레이 방을 준비합니다!`);
        }
    </script>
</body>
</html>
