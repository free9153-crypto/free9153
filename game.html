<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAVE 그림 놀이터</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f2ff;color:#302947;font-family:Arial,sans-serif;text-align:center}
header{background:#8171d9;color:white;padding:20px}
h1{margin:0}
main{max-width:850px;margin:15px auto;padding:12px}
.panel{background:white;padding:17px;border-radius:18px;margin:13px 0;box-shadow:0 3px 12px #0001}
input,button{padding:11px;border-radius:10px;border:1px solid #ddd;font-size:15px;margin:4px}
button{background:#8171d9;color:white;border:0;cursor:pointer}
button:disabled{opacity:.4}
.hidden{display:none!important}
.small{font-size:12px;color:#888}
#status{font-weight:bold;color:#6552b8}
#players{line-height:2}
canvas{display:block;width:100%;height:auto;background:white;border:2px solid #ded9f8;border-radius:12px;touch-action:none}
.tools{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:5px;margin:12px}
#timer,#soloTimer{font-size:40px;font-weight:bold;color:#765cc9;margin:5px}
#topic,#soloTopic{font-size:23px;font-weight:bold;color:#765cc9;padding:12px}
#chatMessages{height:190px;overflow-y:auto;text-align:left;background:#faf9ff;padding:10px;border-radius:10px}
.chatline{padding:5px;border-bottom:1px solid #eee;overflow-wrap:anywhere}
#gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.work{background:#faf9ff;padding:8px;border-radius:12px;min-width:0}
.work img{width:100%;border-radius:8px}
.work p{overflow-wrap:anywhere}
.modeButtons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@media(max-width:450px){#gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>

<header>
<h1>💙 PLAVE 그림 놀이터 💜</h1>
<p>혼자서도, 친구들과 함께도!</p>
</header>

<main>

<section class="panel" id="lobby">
<h2>🎮 그림 모드 선택</h2>
<input id="playerName" placeholder="닉네임" maxlength="12">
<div class="modeButtons">
<button onclick="startSolo()">🎨 혼자 그리기 (20초)</button>
<button onclick="showMultiLobby()">👥 멀티플레이</button>
</div>

<div id="multiLobby" class="hidden">
<hr>
<h3>멀티플레이 입장</h3>
<button onclick="createRoom()">방 만들기</button>
<hr>
<input id="roomInput" placeholder="방 코드 6자리" maxlength="6">
<button onclick="joinRoom()">방 참가</button>
<p class="small">2~5명까지 참가할 수 있어요.</p>
</div>
</section>

<section class="panel hidden" id="game">
<h2>방 코드: <span id="roomCode"></span></h2>
<button onclick="copyRoom()">코드 복사</button>
<button onclick="leaveRoom()">방 나가기</button>
<p id="status">연결 중...</p>
<h3>👥 참가자</h3>
<div id="players"></div>
<button id="startBtn" onclick="startGame()">게임 시작</button>

<div id="playArea" class="hidden">
<hr>
<p>🎯 오늘의 그림 주제</p>
<div id="topic"></div>
<div id="category" class="small"></div>
<p>⏱️ 남은 시간</p>
<div id="timer">10</div>
<p id="turnInfo"></p>
<p id="message"></p>
<p class="small">🟢 그리는 선이 다른 참가자에게 실시간 공개됩니다!</p>

<canvas id="canvas" width="900" height="600"></canvas>

<div class="tools">
<label>색상 <input type="color" id="color" value="#333333"></label>
<label>굵기 <input type="range" id="size" min="2" max="35" value="6"></label>
<button onclick="clearMulti()">지우기</button>
<button onclick="undoMulti()">되돌리기</button>
</div>
<button id="submitBtn" onclick="submitDrawing()">그림 전달하기 ➜</button>
<p class="small">10초가 지나면 자동으로 전달됩니다.</p>
</div>

<hr>
<h3>💬 실시간 채팅</h3>
<div id="chatMessages"><p class="small">채팅을 기다리는 중...</p></div>
<input id="chatInput" placeholder="메시지 입력" maxlength="200" style="width:70%">
<button onclick="sendChat()">전송</button>
</section>
