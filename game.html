
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAVE MULTI DRAW</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f0edff;color:#38334e;font-family:Arial,sans-serif;text-align:center;padding:18px}
h1{color:#7161c9;margin:12px}
.panel{background:white;border-radius:18px;padding:16px;margin:12px auto;max-width:850px;box-shadow:0 3px 12px #aaa2}
input,button,select{padding:11px;border:1px solid #ddd;border-radius:10px;font-size:15px;margin:4px}
button{background:#7969d2;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.45}
canvas{width:100%;max-width:850px;background:white;border:2px solid #c9c1f0;border-radius:12px;touch-action:none;display:block;margin:auto}
#status{font-weight:bold;color:#6556bd}
#players{line-height:1.8}
#timer{font-size:22px;color:#e16a9c;font-weight:bold}
.small{font-size:13px;color:#777}
</style>
</head>
<body>
<h1>💜 PLAVE MULTI DRAW 💜</h1>
<p>친구들과 함께하는 실시간 그림 릴레이</p>

<div class="panel">
  <div id="connection">Firebase 연결 중...</div>
  <input id="playerName" maxlength="12" placeholder="닉네임 입력">
  <br>
  <button id="createBtn">방 만들기</button>
  <br>
  <input id="roomInput" maxlength="6" placeholder="방 코드 6자리">
  <button id="joinBtn">방 입장</button>
</div>

<div class="panel" id="gamePanel" hidden>
  <h2>방 코드: <span id="roomCode"></span></h2>
  <button id="copyBtn">방 코드 복사</button>
  <p id="status">대기 중</p>
  <div id="players"></div>
  <div id="timer">--</div>
  <p class="small">최대 5명 · 한 사람당 15초</p>
  <button id="startBtn" hidden>게임 시작</button>
  <button id="leaveBtn">방 나가기</button>
</div>

<div class="panel" id="drawPanel" hidden>
  <h3>🎨 그림 그리기</h3>
  <p id="turnInfo">대기 중</p>
  <canvas id="canvas" width="900" height="600"></canvas>
  <p>
    색상
    <input id="color" type="color" value="#8069d8">
    굵기
    <select id="width">
      <option value="3">얇게</option>
      <option value="7" selected>보통</option>
      <option value="14">굵게</option>
      <option value="25">아주 굵게</option>
    </select>
  </p>
  <button id="eraseBtn">지우개</button>
  <button id="clearBtn" hidden>전체 지우기 (방장)</button>
  <button id="downloadBtn">그림 저장 PNG</button>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase, ref, set, get, update, onValue,
  push, remove, runTransaction
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
  getAuth, signInAnonymously
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCng-mu7Gsd0hrfR4SlX7kkhfmWhvhkTPg",
  authDomain: "plave-971bd.firebaseapp.com",
  databaseURL: "https://plave-971bd-default-rtdb.firebaseio.com",
  projectId: "plave-971bd",
  storageBucket: "plave-971bd.firebasestorage.app",
  messagingSenderId: "743852481107",
  appId: "1:743852481107:web:a84c1d9ced17c3645644a6",
  measurementId: "G-ENQ8E94BH3"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

let me = null;
let roomCode = null;
let roomData = null;
let eraseMode = false;
let drawing = false;
let points = [];
let advancing = false;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const $ = id => document.getElementById(id);

function randomCode(){
  return Math.random().toString(36).substring(2,8).toUpperCase();
}

function playerName(){
  return $("playerName").value.trim() || "플레이어";
}

function playersList(){
  return Object.entries(roomData?.players || {})
    .sort((a,b)=>(a[1].joinedAt||0)-(b[1].joinedAt||0));
}

function isMyTurn(){
  return roomData?.status === "playing" &&
    roomData?.turn?.uid === me?.uid;
}

function drawStroke(stroke){
  if(!stroke || !stroke.points || !stroke.points.length) return;
  const p=stroke.points;
  ctx.beginPath();
  ctx.moveTo(p[0].x*canvas.width,p[0].y*canvas.height);
  for(let i=1;i<p.length;i++){
    ctx.lineTo(p[i].x*canvas.width,p[i].y*canvas.height);
  }
  ctx.strokeStyle=stroke.color || "#000";
  ctx.lineWidth=stroke.width || 5;
  ctx.lineCap="round";
  ctx.lineJoin="round";
  ctx.stroke();
}

function redraw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const strokes=roomData?.strokes || {};
  Object.values(strokes).forEach(drawStroke);
}

function updateScreen(){
  if(!roomData) return;

  $("roomCode").textContent=roomCode;
  $("gamePanel").hidden=false;
  $("drawPanel").hidden=false;

  const players=playersList();
  $("players").innerHTML=
    "👥 참가자: "+players.map(([uid,p])=>
      `${p.name}${uid===roomData.hostUid?" 👑":""}`
    ).join(" · ");

  const host=me.uid===roomData.hostUid;
  $("startBtn").hidden=!host || roomData.status==="playing";
  $("clearBtn").hidden=!host;

  if(roomData.status==="waiting"){
    $("status").textContent="친구를 기다리는 중이에요!";
    $("turnInfo").textContent="방장이 게임을 시작할 수 있어요.";
  }else{
    const current=roomData.turn?.uid;
    const currentPlayer=roomData.players?.[current];
    $("status").textContent=
      "🎨 "+(currentPlayer?.name || "플레이어")+" 차례!";
    $("turnInfo").textContent=isMyTurn()
      ?"💜 내 차례야! 그림을 그려봐!"
      :"친구가 그림을 그리고 있어요.";
  }

  $("canvas").style.opacity=
    roomData.status==="playing" ? "1" : ".75";
}

async function joinRoom(code){
  code=code.toUpperCase().trim();
  if(!code) throw new Error("방 코드를 입력해 줘.");

  const roomRef=ref(db,"rooms/"+code);
  const snap=await get(roomRef);

  if(!snap.exists()) throw new Error("방을 찾을 수 없어.");

  const result=await runTransaction(
    ref(db,"rooms/"+code+"/players"),
    players=>{
      players=players||{};
      if(players[me.uid]) return players;
      if(Object.keys(players).length>=5) return;
      players[me.uid]={
        name:playerName(),
        joinedAt:Date.now()
      };
      return players;
    }
  );

  if(!result.committed){
    throw new Error("방이 꽉 찼거나 입장할 수 없어.");
  }

  roomCode=code;
  $("roomInput").value=code;

  onValue(roomRef,snapshot=>{
    if(!snapshot.exists()){
      alert("방이 종료되었어.");
      leaveRoom(false);
      return;
    }
    roomData=snapshot.val();
    updateScreen();
    redraw();
  });

  $("connection").textContent="🟢 서버 연결 완료";
}

async function createRoom(){
  const code=randomCode();
  const now=Date.now();

  await set(ref(db,"rooms/"+code),{
    hostUid:me.uid,
    status:"waiting",
    createdAt:now,
    players:{
      [me.uid]:{
        name:playerName(),
        joinedAt:now
      }
    },
    strokes:{},
    turn:{uid:null,endsAt:0,index:0,round:1}
  });

  await joinRoom(code);
}

async function startGame(){
  if(!roomData || me.uid!==roomData.hostUid) return;

  const players=playersList();
  if(players.length<2){
    alert("최소 2명이 입장해야 시작할 수 있어!");
    return;
  }

  await update(ref(db,"rooms/"+roomCode),{
    status:"playing",
    turn:{
      uid:players[0][0],
      index:0,
      round:1,
      endsAt:Date.now()+15000
    }
  });
}

async function advanceTurn(){
  if(advancing || !roomData || me.uid!==roomData.hostUid) return;
  if(roomData.status!=="playing") return;
  if(Date.now()<roomData.turn.endsAt) return;

  advancing=true;
  try{
    const players=playersList();
    if(!players.length) return;

    let index=(roomData.turn.index+1)%players.length;
    let round=roomData.turn.round;
    if(index===0) round++;

    await update(ref(db,"rooms/"+roomCode+"/turn"),{
      uid:players[index][0],
      index,
      round,
      endsAt:Date.now()+15000
    });
  }catch(e){
    console.error(e);
  }finally{
    advancing=false;
  }
}

function pointerPosition(e){
  const rect=canvas.getBoundingClientRect();
  return {
    x:Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width)),
    y:Math.max(0,Math.min(1,(e.clientY-rect.top)/rect.height))
  };
}

canvas.addEventListener("pointerdown",e=>{
  if(!isMyTurn()){
    alert("아직 내 차례가 아니야!");
    return;
  }
  drawing=true;
  points=[pointerPosition(e)];
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointermove",e=>{
  if(!drawing) return;
  const p=pointerPosition(e);
  const previous=points[points.length-1];
  points.push(p);

  ctx.beginPath();
  ctx.moveTo(previous.x*canvas.width,previous.y*canvas.height);
  ctx.lineTo(p.x*canvas.width,p.y*canvas.height);
  ctx.strokeStyle=eraseMode?"#ffffff":$("color").value;
  ctx.lineWidth=eraseMode?35:Number($("width").value);
  ctx.lineCap="round";
  ctx.lineJoin="round";
  ctx.stroke();
});

async function finishDrawing(){
  if(!drawing) return;
  drawing=false;

  if(points.length<2) return;
  if(!isMyTurn()){
    redraw();
    return;
  }

  const stroke={
    points,
    color:eraseMode?"#ffffff":$("color").value,
    width:eraseMode?35:Number($("width").value),
    createdAt:Date.now(),
    uid:me.uid
  };

  try{
    await set(
      push(ref(db,"rooms/"+roomCode+"/strokes")),
      stroke
    );
  }catch(e){
    alert("그림 전송에 실패했어: "+e.message);
  }
  points=[];
}

canvas.addEventListener("pointerup",finishDrawing);
canvas.addEventListener("pointercancel",finishDrawing);

$("eraseBtn").onclick=()=>{
  eraseMode=!eraseMode;
  $("eraseBtn").textContent=eraseMode?"지우개 끄기":"지우개";
};

$("clearBtn").onclick=async()=>{
  if(!roomCode || me.uid!==roomData.hostUid) return;
  if(confirm("그림을 모두 지울까?")){
    await remove(ref(db,"rooms/"+roomCode+"/strokes"));
  }
};

$("downloadBtn").onclick=()=>{
  const link=document.createElement("a");
  link.download="PLAVE-MULTI-DRAW.png";
  link.href=canvas.toDataURL("image/png");
  link.click();
};

$("copyBtn").onclick=async()=>{
  await navigator.clipboard.writeText(roomCode);
  alert("방 코드 복사 완료! "+roomCode);
};

$("createBtn").onclick=async()=>{
  try{
    await createRoom();
  }catch(e){
    alert(e.message);
  }
};

$("joinBtn").onclick=async()=>{
  try{
    await joinRoom($("roomInput").value);
  }catch(e){
    alert(e.message);
  }
};

$("startBtn").onclick=startGame;

async function leaveRoom(removePlayer=true){
  if(roomCode && removePlayer){
    const oldCode=roomCode;
    try{
      await remove(ref(db,"rooms/"+oldCode+"/players/"+me.uid));
      const snap=await get(ref(db,"rooms/"+oldCode));
      if(snap.exists()){
        const room=snap.val();
        const remaining=Object.entries(room.players||{})
          .sort((a,b)=>(a[1].joinedAt||0)-(b[1].joinedAt||0));
        if(room.hostUid===me.uid && remaining.length){
          await update(ref(db,"rooms/"+oldCode),{
            hostUid:remaining[0][0]
          });
        }
      }
    }catch(e){console.error(e);}
  }

  roomCode=null;
  roomData=null;
  $("gamePanel").hidden=true;
  $("drawPanel").hidden=true;
  $("connection").textContent="🟢 서버 연결 완료";
}

$("leaveBtn").onclick=()=>leaveRoom();

async function initialize(){
  try{
    const credential=await signInAnonymously(auth);
    me=credential.user;
    $("connection").textContent="🟢 Firebase 연결 완료";
  }catch(e){
    $("connection").textContent="🔴 연결 오류: "+e.message;
    console.error(e);
  }
}

setInterval(()=>{
  if(roomData && roomCode){
    if(roomData.status==="playing"){
      if(me.uid===roomData.hostUid) advanceTurn();
      const remaining=Math.max(
        0,Math.ceil((roomData.turn.endsAt-Date.now())/1000)
      );
      $("timer").textContent="⏱ "+remaining+"초";
    }else{
      $("timer").textContent="게임 시작 대기";
    }
  }
},500);

initialize();
</script>
</body>
</html>
