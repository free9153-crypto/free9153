<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PLAVE 실시간 멀티 릴레이 그림판</title>
    <!-- Firebase SDK (멀티플레이 & 채팅 서버) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --yejun: #3B82F6; --noah: #A855F7; --bambi: #EC4899;
            --eunho: #EF4444; --hamin: #10B981;
        }
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #E0F2FE 0%, #F3E8FF 50%, #FCE7F3 100%);
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px; padding: 20px;
            width: 100%; max-width: 460px;
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.15);
            border: 3px solid #FFF;
        }
        h1 { font-size: 20px; color: #4C1D95; margin: 0 0 5px 0; text-align: center; }
        .sub { font-size: 13px; color: #6B21A8; text-align: center; margin-bottom: 15px; font-weight: bold; }
        
        /* Setup Screen */
        .setup-group { margin-bottom: 12px; text-align: left; }
        label { font-size: 12px; font-weight: bold; color: #374151; display: block; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px; border-radius: 12px; border: 2px solid #DDD6FE; font-size: 14px; outline: none; background: white; }
        .btn-main { background: linear-gradient(90deg, #8B5CF6, #EC4899); color: white; border: none; width: 100%; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        /* Game Screen */
        #gameScreen, #resultScreen { display: none; }
        .header-status { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .topic-badge { background: #F3E8FF; color: #6B21A8; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        .timer-box { font-size: 20px; font-weight: 900; color: #6B21A8; }

        /* Canvas */
        .canvas-container { position: relative; width: 100%; background: white; border-radius: 16px; border: 3px solid #DDD6FE; overflow: hidden; }
        canvas { display: block; width: 100%; height: 260px; background: white; cursor: crosshair; }

        /* Palette */
        .palette { display: flex; gap: 8px; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
        .color-dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid white; cursor: pointer; }
        .color-dot.active { transform: scale(1.2); border-color: #4C1D95; }

        /* Chat Area */
        .chat-box { background: #F9FAFB; border-radius: 12px; border: 1px solid #E5E7EB; height: 110px; overflow-y: auto; padding: 8px; margin-top: 10px; font-size: 12px; text-align: left; }
        .chat-msg { margin-bottom: 4px; }
        .chat-msg span { font-weight: bold; color: #6B21A8; }
        .chat-input-group { display: flex; gap: 6px; margin-top: 6px; }
        .chat-input-group input { flex: 1; padding: 8px; font-size: 12px; }
        .chat-input-group button { background: #8B5CF6; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 1. 설정 화면 -->
    <div class="card" id="setupScreen">
        <h1>✨ PLAVE 멀티 릴레이 그림판</h1>
        <div class="sub">💬 채팅하며 친구들과 함께 즐기는 10초 릴레이 💬</div>
        
        <div class="setup-group">
            <label>닉네임</label>
            <input type="text" id="nickname" placeholder="닉네임을 입력하세요 (예: 밤비팬)">
        </div>

        <div class="setup-group">
            <label>방 코드 (친구와 같은 코드로 접속!)</label>
            <input type="text" id="roomCode" value="PLAVE123">
        </div>

        <div class="setup-group">
            <label>👥 참여 인원 선택 (멀티플레이 모드)</label>
            <select id="playerCount">
                <option value="1">1인 연습 모드 (멀티X)</option>
                <option value="2">2인 멀티 플레이</option>
                <option value="3">3인 멀티 플레이</option>
                <option value="4" selected>4인 멀티 플레이</option>
                <option value="5">5인 멀티 플레이</option>
            </select>
        </div>

        <button class="btn-main" onclick="joinRoom()">방 접속하기 🚀</button>
    </div>

    <!-- 2. 게임 화면 -->
    <div class="card" id="gameScreen">
        <div class="header-status">
            <span class="topic-badge" id="topicDisplay">주제: 로딩중...</span>
            <div class="timer-box" id="timer">⏱️ 10</div>
        </div>

        <div style="font-size:14px; font-weight:bold; color:#1F2937; margin-bottom:6px; text-align:center;" id="turnDisplay">대기 중...</div>

        <div class="canvas-container">
            <canvas id="paintCanvas" width="400" height="260"></canvas>
        </div>

        <!-- PLAVE 멤버 상징 팔레트 -->
        <div class="palette">
            <div class="color-dot active" style="background:#000000;" onclick="setColor('#000000', this)"></div>
            <div class="color-dot" style="background:var(--yejun);" title="예준 파랑" onclick="setColor('#3B82F6', this)"></div>
            <div class="color-dot" style="background:var(--noah);" title="노아 보라" onclick="setColor('#A855F7', this)"></div>
            <div class="color-dot" style="background:var(--bambi);" title="밤비 분홍" onclick="setColor('#EC4899', this)"></div>
            <div class="color-dot" style="background:var(--eunho);" title="은호 빨강" onclick="setColor('#EF4444', this)"></div>
            <div class="color-dot" style="background:var(--hamin);" title="하민 초록" onclick="setColor('#10B981', this)"></div>
        </div>

        <!-- Realtime Chat -->
        <div class="chat-box" id="chatBox"></div>
        <div class="chat-input-group">
            <input type="text" id="chatInput" placeholder="메시지를 입력하세요..." onkeypress="if(event.key==='Enter') sendChat()">
            <button onclick="sendChat()">전송</button>
        </div>
    </div>

    <!-- 3. 결과 화면 -->
    <div class="card" id="resultScreen">
        <h1>🎉 작품 완성!</h1>
        <div class="sub" id="resultTopic"></div>
        <div style="text-align:center; margin: 15px 0;">
            <img id="resultImage" style="width:100%; border-radius:16px; border:3px solid #DDD6FE;">
        </div>
        <button class="btn-main" onclick="downloadImage()">💾 이미지 저장하기</button>
        <button style="width:100%; margin-top:8px; padding:12px; border:none; background:#F3F4F6; border-radius:10px; font-weight:bold;" onclick="location.reload()">🔄 메인으로 이동</button>
    </div>

    <script>
        // ✅ [오타 수정 완료] 파이어베이스 무료 실시간 데이터베이스 연동 설정 (한국 서버)
        const firebaseConfig = { databaseURL: "https://plave-relay-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myName = "", roomRef = null;
        let color = "#000000", isDrawing = false;
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');

        function joinRoom() {
            myName = document.getElementById('nickname').value.trim() || "익명 힐러";
            const code = document.getElementById('roomCode').value.trim() || "PLAVE123";
            
            // 파이어베이스 데이터베이스 경로 설정
            roomRef = db.ref('rooms/' + code);
            
            // 화면 전환
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';

            // [채팅 기능] 실시간 채팅 수신
            roomRef.child('chat').on('child_added', (snapshot) => {
                const data = snapshot.val();
                if (data && data.name && data.msg) {
                    const box = document.getElementById('chatBox');
                    box.innerHTML += `<div class="chat-msg"><span>${data.name}:</span> ${data.msg}</div>`;
                    box.scrollTop = box.scrollHeight; // 새 메시지가 오면 자동으로 아래로 스크롤
                }
            });

            // [멀티플레이 그림 기능] 캔버스 실시간 동기화 (받기)
            roomRef.child('draw').on('value', (snapshot) => {
                const dataUrl = snapshot.val();
                if (dataUrl) {
                    const img = new Image();
                    img.onload = () => {
                        // ctx.clearRect(0, 0, canvas.width, canvas.height); // 다른 사람 그림을 그리기 전에 캔버스를 한 번 지울지 선택 (주석 해제 시 턴 전환 시 지워짐)
                        ctx.drawImage(img, 0, 0);
                    };
                    img.src = dataUrl;
                }
            });

            // 임시 주제 제시 (진짜 멀티플레이 로직은 추가 구현 필요)
            document.getElementById('topicDisplay').innerText = "주제: 로딩 완료! (대기 중)";

            initCanvas();
            sendSystemChat(`${myName} 님이 방에 입장하셨습니다!`);
        }

        // 초기 캔버스 설정
        function initCanvas() {
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // [채팅 기능] 메시지 전송
        function sendChat() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return; // 빈 메시지는 전송 안 함

            if (roomRef) {
                roomRef.child('chat').push({ name: myName, msg: msg });
                input.value = "";
            } else {
                alert("방에 아직 접속하지 않았습니다.");
            }
        }

        // 시스템 공지 채팅 전송
        function sendSystemChat(msg) {
            if (roomRef) {
                roomRef.child('chat').push({ name: "📢 시스템", msg: msg });
            }
        }

        /* 🎨 그림판 기능 및 실시간 동기화 (보내기) */
        
        // 마우스 및 터치 위치 계산
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (clientX - rect.left) * (canvas.width / rect.width), y: (clientY - rect.top) * (canvas.height / rect.height) };
        }

        // 그림 그리기 시작
        function startDrawing(e) {
            // 진짜 멀티플레이 시에는 내 턴인지 확인하는 로직이 필요합니다.
            // if (!isMyTurn) return; 

            isDrawing = true;
            draw(e);
        }

        // 그림 그리기 중단 및 파이어베이스에 업로드
        function stopDrawing() { 
            if(isDrawing) { 
                isDrawing = false; 
                ctx.beginPath(); // 그리기 선 초기화

                // 내 그림 데이터를 파이어베이스에 실시간으로 업로드하여 다른 사람들에게 보여줌
                if(roomRef) {
                    roomRef.child('draw').set(canvas.toDataURL());
                }
            } 
        }

        // 실제 그리기 함수
        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.lineWidth = 4;
            ctx.lineCap = 'round'; // 선 끝을 둥글게
            ctx.strokeStyle = color; // 현재 선택된 색상

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke(); // 선을 그림
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y); // 다음 점으로 이동
        }

        // 이벤트 리스너 등록 (PC & 모바일)
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing); // 마우스가 캔버스를 벗어나도 그리기 중단

        canvas.addEventListener('touchstart', (e) => { startDrawing(e); e.preventDefault(); });
        canvas.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); });
        canvas.addEventListener('touchend', stopDrawing);

        // 색상 팔레트 설정
        function setColor(c, el) {
            color = c;
            // 활성화된 색상 표시 변경
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            if(el) el.classList.add('active');
        }

        // 완성된 이미지 저장
        function downloadImage() {
            const dataUrl = canvas.toDataURL();
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = 'PLAVE_Relay_Drawing.png';
            a.click();
        }
    </script>
</body>
</html>
