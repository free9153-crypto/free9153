<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>아이돌 포카 짝맞추기</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#fce7f3,#ede9fe);font-family:Arial,sans-serif;color:#49345d;padding:12px}
.app{max-width:650px;margin:auto}
header{text-align:center;padding:15px}
h1{font-size:26px;margin:8px}
.sub{color:#9479a9;font-size:13px}
.panel{background:#ffffffdf;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #b99bc522}
label{display:block;font-weight:bold;margin:12px 0 7px}
input,select{width:100%;padding:12px;border:1px solid #e4d6ef;border-radius:12px;background:white;font-size:15px}
button{border:0;border-radius:13px;padding:12px 15px;background:#a78bfa;color:white;font-weight:bold;font-size:14px;cursor:pointer}
button.secondary{background:#f1e8fa;color:#75568e}
button.active{background:#8057ca;color:white}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat{background:#f8f1ff;padding:12px;border-radius:13px}
.stat strong{display:block;font-size:21px;color:#8b65c5}.stat small{color:#927fa3}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:15px}
.card{aspect-ratio:3/4;border-radius:13px;perspective:700px;cursor:pointer}
.inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .35s}
.card.open .inner,.card.matched .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:13px;backface-visibility:hidden;overflow:hidden;display:flex;align-items:center;justify-content:center}
.back{background:linear-gradient(145deg,#b9a0f5,#f5a9d2);color:white;font-size:30px;border:3px solid white}
.front{transform:rotateY(180deg);background:white;border:3px solid white;flex-direction:column}
.front img{width:100%;height:100%;object-fit:cover}
.front .name{font-size:12px;font-weight:bold;text-align:center;padding:4px;overflow-wrap:anywhere}
.front .emoji{font-size:35px}
.card.matched .front{border-color:#a5e5bd}
#message{text-align:center;font-weight:bold;padding:12px;color:#865bb4}
.hidden{display:none!important}
footer{text-align:center;color:#a18bac;font-size:12px;padding:15px}
@media(max-width:400px){.board{gap:6px}.card{border-radius:10px}}
</style>
</head>
<body>
<div class="app">
<header><div style="font-size:38px">💜 🎀 💗</div><h1>아이돌 포카 짝맞추기</h1><div class="sub">내 최애 포카를 찾아보자!</div></header>
<section class="panel">
<label>🎤 아이돌 선택</label>
<div class="row">
<button id="plaveBtn" class="active" onclick="preset()">💜 PLAVE</button>
<button id="customBtn" class="secondary" onclick="customMode()">다른 아이돌</button>
</div>
<div id="customArea" class="hidden">
<label>아이돌 이름</label><input id="idolName" placeholder="예: 세븐틴, 투모로우바이투게더">
<label>멤버 이름 (쉼표로 구분)</label><input id="members" placeholder="예: 승관, 민규, 정한">
</div>
<label>📸 포카 사진 등록 (선택)</label>
<input type="file" id="photos" accept="image/*" multiple>
<div class="sub">사진을 여러 장 선택하면 각 사진이 한 쌍이 돼! 사진은 이 기기에서만 사용돼.</div>
<label>🎮 게임 방식</label>
<select id="mode"><option value="1">혼자 하기</option><option value="2">2인 번갈아 하기</option></select>
<label>🧩 난이도</label>
<select id="level"><option value="4">쉬움 (4쌍)</option><option value="6" selected>보통 (6쌍)</option><option value="8">어려움 (8쌍)</option><option value="10">고수 (10쌍)</option></select>
<button style="width:100%;margin-top:15px" onclick="startGame()">게임 시작하기 💗</button>
</section>
<section id="game" class="panel hidden">
<div class="stats">
<div class="stat"><strong id="moves">0</strong><small>뒤집은 횟수</small></div>
<div class="stat"><strong id="pairs">0</strong><small>맞춘 쌍</small></div>
<div class="stat"><strong id="turn">나</strong><small>현재 차례</small></div>
</div>
<div id="message">같은 포카 두 장을 찾아봐!</div>
<div id="board" class="board"></div>
<div class="row" style="margin-top:17px"><button class="secondary" onclick="startGame()">다시 시작</button><button onclick="document.getElementById('game').classList.add('hidden')">설정으로</button></div>
</section>
<footer>MY IDOL MEMORY GAME · 나만의 포카 놀이터</footer>
</div>
<script>
const plave=["예준","노아","밤비","은호","하민"];
let idol="PLAVE",names=[...plave],custom=false,deck=[],first=null,lock=false,moves=0,matched=0,player=1,scores=[0,0],mode=1,imageUrls=[];
function preset(){idol="PLAVE";names=[...plave];custom=false;document.getElementById("customArea").classList.add("hidden");document.getElementById("plaveBtn").classList.add("active");document.getElementById("customBtn").classList.remove("active")}
function customMode(){custom=true;document.getElementById("customArea").classList.remove("hidden");document.getElementById("customBtn").classList.add("active");document.getElementById("plaveBtn").classList.remove("active")}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function startGame(){
 if(custom){idol=document.getElementById("idolName").value.trim()||"나의 아이돌";names=document.getElementById("members").value.split(",").map(x=>x.trim()).filter(Boolean)}
 const count=Number(document.getElementById("level").value),files=Array.from(document.getElementById("photos").files);
 imageUrls.forEach(URL.revokeObjectURL);imageUrls=files.map(f=>URL.createObjectURL(f));
 if(!names.length)names=["최애1","최애2","최애3","최애4"];
 let items=[];
 for(let i=0;i<count;i++){let file=files.length?files[i%files.length]:null;items.push({id:i,name:file?file.name.replace(/\.[^.]+$/,""):names[i%names.length],image:file?imageUrls[i%files.length]:null,emoji:["💜","🩷","💙","💛","🤍","💚","🧡","💗","⭐","🎀"][i%10]})}
 deck=shuffle([...items,...items].map((x,i)=>({...x,key:i})));first=null;lock=false;moves=0;matched=0;player=1;scores=[0,0];mode=Number(document.getElementById("mode").value);
 document.getElementById("game").classList.remove("hidden");document.getElementById("moves").textContent=0;document.getElementById("pairs").textContent=0;updateTurn();drawBoard();document.getElementById("message").textContent=idol+" 포카를 찾아보자! 💗";document.getElementById("game").scrollIntoView({behavior:"smooth"});
}
function updateTurn(){document.getElementById("turn").textContent=mode===1?"나":"플레이어 "+player}
function drawBoard(){const board=document.getElementById("board");board.innerHTML="";deck.forEach(card=>{const el=document.createElement("div");el.className="card";el.innerHTML=`<div class="inner"><div class="face back">♡</div><div class="face front">${card.image?`<img src="${card.image}" alt="포카">`:`<div class="emoji">${card.emoji}</div><div class="name">${escapeHTML(card.name)}</div>`}</div></div>`;el.onclick=()=>flip(el,card);board.appendChild(el)})}
function flip(el,card){
 if(lock||el.classList.contains("open")||el.classList.contains("matched"))return;
 el.classList.add("open");
 if(!first){first={el,card};return}
 moves++;document.getElementById("moves").textContent=moves;
 if(first.card.id===card.id){el.classList.add("matched");first.el.classList.add("matched");matched++;scores[player-1]++;document.getElementById("pairs").textContent=matched;first=null;document.getElementById("message").textContent="짝 찾았다! 🎉";
  if(matched===deck.length/2)setTimeout(()=>{let result=mode===1?"축하해! "+moves+"번 만에 완성했어! 💗":scores[0]===scores[1]?"무승부! 둘 다 잘했어! 💜":"플레이어 "+(scores[0]>scores[1]?1:2)+" 승리! 🏆";document.getElementById("message").textContent=result;alert(result)},300);
 }else{lock=true;document.getElementById("message").textContent="아깝다! 다음 기회에 💕";setTimeout(()=>{el.classList.remove("open");first.el.classList.remove("open");first=null;lock=false;if(mode===2){player=player===1?2:1;updateTurn()}},850)}
}
</script>
</body>
</html>
